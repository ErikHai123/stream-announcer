name: Check YouTube Stream

concurrency:
  group: bot-run
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Пропустить весь хвост старых видео"
        type: boolean
        default: false
      force_video_url:
        description: "Принудительно опубликовать видео по ссылке (оставьте пустым для авто)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run announcer script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TIMEZONE: "Europe/Moscow"
          CATCH_UP_ONLY: ${{ github.event.inputs.catch_up }}
          FORCE_VIDEO_URL: ${{ github.event.inputs.force_video_url }}
        run: python main.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_ids.json milestone_state.json daily_stats.json live_poll_state.json random_posted_ids.json
          git diff --quiet --cached || git commit -m "Update state files"
          git pull --rebase
          git push
